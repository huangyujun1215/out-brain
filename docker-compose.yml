services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nbboss
      POSTGRES_PASSWORD: nbboss
      POSTGRES_DB: nbboss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbboss"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: nbboss-ai-brain-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      API_PORT: "3001"
      DATABASE_URL: postgresql://nbboss:nbboss@postgres:5432/nbboss?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /app/data/uploads
    ports:
      - "3001:3001"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    image: nbboss-ai-brain-api:local
    env_file: .env
    environment:
      WORKER_MODE: "true"
      DATABASE_URL: postgresql://nbboss:nbboss@postgres:5432/nbboss?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /app/data/uploads
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  upload_data:
