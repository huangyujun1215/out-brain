name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static and unit checks
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=ci-access-secret-at-least-32-characters/' .env
          sed -i 's/JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=ci-refresh-secret-at-least-32-characters/' .env
          chmod 600 .env

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3001/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://nbboss:nbboss@localhost:5432/nbboss?schema=public
          REDIS_URL: redis://localhost:6379
          STORAGE_ROOT: ${{ runner.temp }}/nbboss-test-uploads
        run: pnpm test:integration

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          DATABASE_URL: postgresql://nbboss:nbboss@localhost:5432/nbboss?schema=public
        run: pnpm test:e2e

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color api worker web postgres redis

      - name: Stop stack
        if: always()
        run: docker compose down -v
